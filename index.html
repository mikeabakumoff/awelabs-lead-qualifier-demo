<style>
:root{--bg:#0a0a0b;--bg2:#0d120e;--bg3:#121a14;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--text:#e8f0e8;--muted:#7a857c;--g:#00ff41;--g2:#00b82e;--warn:#e8c45a;--red:#ff6b5a;
--head:'Manrope',sans-serif;--body:'Manrope',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%);opacity:.6}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{position:relative;display:grid;grid-template-rows:auto auto 1fr;height:100vh;max-width:1400px;margin:0 auto;padding:0 20px 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;border-bottom:1px solid var(--line)}
.logo{font:700 18px var(--mono);display:flex;align-items:center}.logo .u{color:var(--g)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--g);margin-left:4px;box-shadow:0 0 10px rgba(0,255,65,.5);animation:bl 1.05s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.ttl{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:10px}.ttl b{color:var(--text);font-weight:500}
.pill{border:1px solid rgba(0,255,65,.35);color:var(--g);border-radius:999px;padding:3px 10px;font:11px var(--mono)}
.right{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.lang button{color:var(--muted);font:500 12px var(--mono);padding:6px 12px}.lang button.on{background:var(--g);color:var(--bg)}
.back{font:12px var(--mono);color:var(--muted)}.back:hover{color:var(--g)}
.note{margin:14px 0;padding:10px 14px;border:1px dashed var(--line2);border-radius:10px;font:12px var(--mono);color:var(--muted)}
.note b{color:var(--text);font-weight:500}

.main{display:grid;grid-template-columns:280px 1fr 380px;gap:16px;min-height:0}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ph{padding:14px 16px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.side{padding:16px;gap:18px;overflow:auto}
.side h4{font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.sc{display:flex;flex-direction:column;gap:8px}
.sc button{text-align:left;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);transition:.2s}
.sc button b{display:block;font-weight:600;font-size:14px}
.sc button span{font-size:12.5px;color:var(--muted)}
.sc button:hover{border-color:rgba(0,255,65,.5)}
.sc button.on{border-color:var(--g);background:rgba(0,255,65,.07)}
.sc button.on b{color:var(--g)}
.sc button:disabled{cursor:default}
.sc button:disabled:not(.on){opacity:.45}
.rate{list-style:none;font-size:13px;display:flex;flex-direction:column;gap:6px}
.rate li{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.rate li b{color:var(--text);font:500 12px var(--mono);white-space:nowrap}
.rule{font-size:12.5px;color:var(--muted);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.rule b{color:var(--g);font-weight:600}

.adhd{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.adimg{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--bg3),rgba(0,255,65,.15));border:1px solid var(--line2);display:grid;place-items:center;font:700 13px var(--mono);color:var(--g)}
.adhd b{display:block;font-size:14px;font-weight:600}
.adhd span{font:11px var(--mono);color:var(--muted)}
.chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.day{align-self:center;font:11px var(--mono);color:var(--muted);padding:4px 12px;border:1px solid var(--line);border-radius:999px}
.m{max-width:78%;padding:10px 14px;border-radius:14px;animation:in .3s ease;font-size:14.5px}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.m.c{background:var(--bg3);border:1px solid var(--line2);border-bottom-left-radius:4px}
.m.b{align-self:flex-end;background:rgba(0,255,65,.07);border:1px solid rgba(0,255,65,.25);border-bottom-right-radius:4px}
.m small{display:flex;justify-content:space-between;gap:14px;font:10.5px var(--mono);color:var(--muted);margin-bottom:3px}
.m.b small{color:var(--g)}
.m .tag{display:inline-block;margin-top:6px;font:10.5px var(--mono);color:var(--muted);border:1px dashed var(--line2);border-radius:6px;padding:2px 7px}
.typing{align-self:flex-end;display:flex;gap:4px;padding:12px 14px;border-radius:14px;background:rgba(0,255,65,.05);border:1px solid rgba(0,255,65,.18)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--g);animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.typing.c{align-self:flex-start;background:var(--bg3);border-color:var(--line2)}.typing.c i{background:var(--muted)}
.inp{border-top:1px solid var(--line);padding:12px;display:flex;gap:10px;align-items:center}
.inp .f{flex:1;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);color:var(--muted);font-size:13.5px}
.go{padding:12px 18px;border-radius:12px;background:var(--g);color:var(--bg);font-weight:600;font-size:14px;white-space:nowrap}
.go:disabled{opacity:.4;cursor:default}

.rp{overflow:auto;padding:16px;gap:14px}
.box{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:14px}
.box h5{font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.st{font:11px var(--mono);padding:3px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);text-transform:none;letter-spacing:0}
.st.hot{color:var(--g);border-color:rgba(0,255,65,.45);background:rgba(0,255,65,.08)}
.st.warm{color:var(--warn);border-color:rgba(232,196,90,.45);background:rgba(232,196,90,.07)}
.st.off{color:var(--red);border-color:rgba(255,107,90,.4);background:rgba(255,107,90,.06)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{text-align:right;min-height:1.2em}
.kv dd.fill{animation:fl .6s}
@keyframes fl{from{color:var(--g)}}
.steps{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.steps li{color:var(--muted);display:flex;gap:8px}.steps li::before{content:"○";font-family:var(--mono)}
.steps li.ok{color:var(--text)}.steps li.ok::before{content:"✓";color:var(--g)}
.steps li.no{color:var(--text)}.steps li.no::before{content:"✕";color:var(--red)}
.tg{border:1px solid rgba(0,255,65,.3);border-radius:14px;background:rgba(0,255,65,.04);padding:14px;animation:in .35s;font-size:13.5px}
.tg .h{display:flex;align-items:center;gap:8px;font:600 12px var(--mono);color:var(--g);margin-bottom:8px}
.tg .h i{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g)}
.tg p{margin-bottom:4px}.tg p b{font-weight:600}
.tg.quiet{border-color:var(--line);background:var(--bg)}.tg.quiet .h{color:var(--muted)}.tg.quiet .h i{background:var(--muted);box-shadow:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:500 22px var(--head)}
.stat span{font-size:12px;color:var(--muted)}
.stat.g b{color:var(--g)}
.empty{font-size:13px;color:var(--muted)}

@media(max-width:1180px){.main{grid-template-columns:1fr 360px}.side{display:none}.mob{display:flex!important}}
@media(max-width:820px){.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr}.chatp{height:72vh}.ttl .hide{display:none}}
.mob{display:none;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.mob button{white-space:nowrap;padding:7px 12px;border:1px solid var(--line2);border-radius:999px;font-size:12.5px}
.mob button.on{border-color:var(--g);color:var(--g)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* responsive v2 */
.feed>*,.chat>*,.list>*,.lst>*{flex-shrink:0}
@media(max-width:640px){.chat{padding:12px}.m{max-width:100%}.dlv li{font-size:12.5px}.it{grid-template-columns:minmax(0,1fr) auto}}

.app{grid-template-columns:minmax(0,1fr)}.app>*,.main>*{min-width:0}
@media(max-width:860px){.main{grid-template-columns:minmax(0,1fr)!important}}
@media(max-width:640px){
.app{padding:0 12px 16px}
.top{height:auto;flex-wrap:wrap;gap:8px 12px;padding:12px 0}
.top>div:first-child{gap:10px!important;min-width:0;flex-wrap:wrap}
.ttl{flex-wrap:wrap;gap:6px;font-size:11px}.ttl span[data-i]{display:none}
.right{gap:8px;margin-left:auto}.back{font-size:11px}
.lang button{padding:8px 12px}
.note{font-size:11px;line-height:1.5}
button,.btn{min-height:40px}
}
</style>
</head>

  $('sT').textContent=stats.t.length?Math.round(stats.t.reduce(function(a,b){return a+b},0)/stats.t.length)+(L==='ru'?' сек':' s'):'-'}

  if(!greeted){var dl=document.createElement('div');dl.className='day';dl.textContent=t.dayL;chat.appendChild(dl);greeted=true}

    else{var tb=typing(false),sec=8+Math.round(Math.random()*20);await wait(900);tb.remove();msg('b',t.bot,row[1]);stats.r++;stats.t.push(sec);upStats();
      var f=row[2]||{};if(f.t)setKV('kT',f.t);if(f.b)setKV('kB',f.b);if(f.o)setKV('kO',f.o);if(f.c)setKV('kC',f.c);
